const pageSize=30;let page=0,category='';let matched=[];
const byId=id=>document.getElementById(id);
function element(tag,content,parent,cls){const n=document.createElement(tag);if(content!==null)n.textContent=content;if(cls)n.className=cls;parent.appendChild(n);return n;}
const categoryButtons=[];
for(const [name,count] of [['',data.cards.length],...Object.entries(data.counts)]){const b=element('button',`${name||'All images'} (${count.toLocaleString()})`,byId('categories'));b.onclick=()=>{category=name;page=0;render();};categoryButtons.push([name,b]);}
for(const camera of [...new Set(data.cards.map(c=>c.camera))].sort((a,b)=>Number(a)-Number(b))){const o=element('option',camera,byId('camera'));o.value=camera;}
function render(){const camera=byId('camera').value;const query=byId('search').value.trim().replace(/[^0-9]/g,'');matched=data.cards.filter(c=>(!category||c.category===category)&&(!camera||c.camera===camera)&&(!query||(c.date+c.time).includes(query)));const pages=Math.max(1,Math.ceil(matched.length/pageSize));page=Math.min(page,pages-1);byId('resultCount').textContent=matched.length?`Showing ${page*pageSize+1}–${Math.min((page+1)*pageSize,matched.length)} of ${matched.length.toLocaleString()} matching images.`:'No matching images.';for(const id of ['pageNumber','pageNumberBottom'])byId(id).textContent=`Page ${page+1} of ${pages}`;for(const id of ['previous','previousBottom'])byId(id).disabled=page===0;for(const id of ['next','nextBottom'])byId(id).disabled=page===pages-1;for(const [name,b] of categoryButtons)b.classList.toggle('active',name===category);byId('images').replaceChildren();for(const c of matched.slice(page*pageSize,(page+1)*pageSize)){const article=element('article',null,byId('images'));element('h2',`Camera ${c.camera} / ${c.date} ${c.time}`,article);element('p',c.category,article,'label');const pair=element('div',null,article,'pair');for(const [label,url] of [['Original',c.original],['Adjusted',c.adjusted]]){const figure=element('figure',null,pair);element('figcaption',label,figure);const link=element('a',null,figure);link.href=url;link.target='_blank';link.rel='noopener';const image=element('img',null,link);image.src=url;image.alt=`${label}: camera ${c.camera}, ${c.date} ${c.time}`;image.width=c.width;image.height=c.height;image.loading='lazy';image.decoding='async';}element('p','Click either image to open it at full resolution.',article,'label');}}
function move(delta){page+=delta;render();byId('resultCount').scrollIntoView({block:'start'});}
for(const id of ['previous','previousBottom'])byId(id).onclick=()=>move(-1);for(const id of ['next','nextBottom'])byId(id).onclick=()=>move(1);byId('camera').onchange=()=>{page=0;render();};byId('search').oninput=()=>{page=0;render();};render();
